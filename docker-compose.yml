services:
  web:
    build: .
    image: lockdown-web:latest
    container_name: lockdown-web
    restart: unless-stopped
    env_file: .env
    expose:
      - "8001"
    networks:
      - lockdown
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: lockdown-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "4443:4443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/letsencrypt/live/<YOUR_DOMAIN>:ro
    networks:
      - lockdown

networks:
  lockdown:
    driver: bridge
